services:
- type: web
  name: kemo-tournament
  runtime: node
  plan: free
  buildCommand: "npx -y pnpm@10 install && npx -y pnpm@10 --filter @workspace/tournament run build && npx -y pnpm@10 --filter @workspace/api-server run build"
  startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
  envVars:
    - key: NODE_ENV
      value: production
    - key: NODE_VERSION
      value: 22
    - key: PORT
      value: 10000
    # رابط قاعدة بيانات Neon — Render راح يطلبه منك وقت الإنشاء
    - key: DATABASE_URL
      sync: false
    # كلمة سر لوحة الأدمن — اكتبها أنت وقت الإنشاء واحفظها
    - key: ADMIN_PASSWORD
      sync: false
    - key: SESSION_SECRET
      generateValue: true
  healthCheckPath: /api/healthz
